<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your Food4Love account</title>
  </head>
  <body
    style="
      margin: 0;
      background: #fffaf4;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      color: #2f211b;
    "
  >
    <main
      style="
        box-sizing: border-box;
        max-width: 560px;
        margin: 0 auto;
        border: 1px solid #eee2d6;
        border-radius: 20px;
        background: #ffffff;
        padding: 32px;
      "
    >
      <p
        style="
          margin: 0;
          color: #176044;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        "
      >
        Food4Love
      </p>
      <h1 style="margin: 20px 0 12px; font-size: 26px; line-height: 1.25">
        Welcome. Confirm your email to get started.
      </h1>
      <p style="margin: 0; color: #6e5a52; font-size: 15px; line-height: 1.7">
        Thanks for creating a Food4Love account. Confirm your email address to
        continue setting up your profile and connect over good food.
      </p>
      <p style="margin: 28px 0">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            border-radius: 10px;
            background: #176044;
            padding: 14px 22px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
          "
          >Confirm email</a
        >
      </p>
      <p style="margin: 0; color: #81736c; font-size: 12px; line-height: 1.6">
        If you did not create this account, you can ignore this email.
      </p>
    </main>
  </body>
</html>
