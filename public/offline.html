<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4b8b57" />
    <title>You’re offline · Food4Love</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #fffaf4;
        color: #2f211b;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.7rem;
      }
      p {
        color: #6e5a52;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 12px;
        padding: 0 20px;
        border-radius: 999px;
        background: #4b8b57;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Food4Love" />
      <h1>You’re offline for now</h1>
      <p>
        Reconnect to discover cooks, see your chats, and update your account.
      </p>
      <a href="/swipe">Try again</a>
    </main>
  </body>
</html>
